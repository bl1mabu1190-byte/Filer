
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zaid</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:#080b16;
  color:white;
  overflow-x:hidden;
}

.hero{
  padding:60px 20px;
  text-align:center;
  background:linear-gradient(135deg,#00f0ff22,#8a2eff22);
}

.profile{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #00f0ff;
  animation:float 4s infinite ease-in-out;
}

@keyframes float{
  50%{
    transform:translateY(-10px);
  }
}

h1{
  font-size:52px;
  margin-top:20px;
  background:linear-gradient(90deg,#00f0ff,#8a2eff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.glass{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  padding:24px;
  border-radius:24px;
  margin:20px auto;
  width:90%;
  max-width:1100px;
}

.skills{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.skill{
  padding:10px 18px;
  background:linear-gradient(135deg,#00f0ff,#8a2eff);
  border-radius:999px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.tool-card{
  background:rgba(255,255,255,.05);
  border-radius:20px;
  padding:20px;
  text-align:center;
  transition:.3s;
}

.tool-card:hover{
  transform:translateY(-5px);
}

.tool-card img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.btn{
  display:inline-block;
  margin-top:12px;
  padding:10px 16px;
  background:linear-gradient(135deg,#00f0ff,#8a2eff);
  border-radius:10px;
  color:white;
  text-decoration:none;
}

.fade{
  animation:fade .7s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>

</head>

<body>

</div>

</body>
</html>
