<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuroCV AI Generator</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="particles"></div>

<header class="navbar">
  <div class="logo">⚡ NeuroCV AI</div>

  <nav>
    <a href="#generator">Generator</a>
    <a href="#preview">Preview</a>
    <button id="themeToggle">🌙</button>
  </nav>
</header>

<section class="hero">
  <h1>AI Powered <span>Futuristic CV Generator</span></h1>
  <p>Create stunning animated resume websites instantly.</p>
</section>

<section id="generator" class="container">

  <div class="glass form-card">

    <h2>Generate Your CV</h2>

    <form id="cvForm">

      <div class="grid">

        <input type="text" placeholder="Full Name" id="fullName" required/>
        <input type="text" placeholder="Username" id="username" required/>
        <input type="text" placeholder="Profile Image URL" id="profileImage"/>
        <input type="text" placeholder="Profession" id="profession"/>

        <input type="email" placeholder="Email" id="email"/>
        <input type="text" placeholder="Phone" id="phone"/>
        <input type="text" placeholder="Address" id="address"/>
        <input type="text" placeholder="Website" id="website"/>

        <input type="text" placeholder="GitHub" id="github"/>
        <input type="text" placeholder="LinkedIn" id="linkedin"/>

      </div>

      <textarea placeholder="About Me" id="about"></textarea>
      <textarea placeholder="Skills (comma separated)" id="skills"></textarea>
      <textarea placeholder="Experience" id="experience"></textarea>
      <textarea placeholder="Education" id="education"></textarea>
      <textarea placeholder="Projects" id="projects"></textarea>
      <textarea placeholder="Certifications" id="certifications"></textarea>
      <textarea placeholder="Languages" id="languages"></textarea>
      <textarea placeholder="Interests" id="interests"></textarea>

      <div class="tools-section">
        <h3>Professional Tools</h3>

        <div id="toolsContainer"></div>

        <button type="button" id="addToolBtn" class="neon-btn">
          + Add Tool
        </button>
      </div>

      <button type="submit" class="generate-btn">
        Generate AI CV
      </button>

    </form>

  </div>

  <div id="preview" class="glass preview-card">
    <h2>Live Preview</h2>

    <iframe id="previewFrame"></iframe>
  </div>

</section>

<div id="toast"></div>

<div class="modal hidden" id="successModal">
  <div class="modal-content glass">

    <h2>CV Generated Successfully 🚀</h2>

    <input type="text" id="generatedUrl" readonly/>

    <div class="modal-buttons">
      <a id="openCvBtn" target="_blank" class="neon-btn">Open CV</a>

      <button id="copyBtn" class="neon-btn">
        Copy URL
      </button>

      <button id="downloadBtn" class="neon-btn">
        Download HTML
      </button>
    </div>

  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
